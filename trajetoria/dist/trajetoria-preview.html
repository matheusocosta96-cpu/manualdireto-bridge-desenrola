<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101613">
  <title>Trajetória · Seu progresso</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%23c4d7a6' d='M8 34 20 22l8 6L40 10v10L29 37l-9-6-12 12z'/%3E%3C/svg%3E">
  <style>
:root {
  color-scheme: dark;
  --bg: #101613;
  --panel: #19201c;
  --border: #2c352e;
  --text: #eef1e9;
  --muted: #a2aea4;
  --accent: #c4d7a6;
  --warn: #e7c07a;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 15px;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

button {
  border: 1px solid var(--border);
  background: #222c24;
  color: var(--text);
  border-radius: 12px;
  padding: 11px 15px;
  min-height: 44px;
}
button.primary { background: var(--accent); color: #1b2817; border: 0; font-weight: 650; }
button.small { padding: 7px 10px; font-size: .85rem; min-height: 36px; }
button.ghost { background: transparent; }

/* Estrutura ------------------------------------------------------------- */

.shell { max-width: 1180px; margin: auto; display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
.sidebar { padding: 36px 22px; border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; }
.brand { font-size: 24px; font-weight: 700; letter-spacing: -1px; }
.brand span { color: var(--accent); }
.brand-sub { font-size: 12px; color: var(--muted); margin: 8px 0 40px; }
.nav { display: flex; flex-direction: column; gap: 10px; }
.nav button { text-align: left; border: 0; background: none; color: var(--muted); padding: 13px; }
.nav button.active { background: #293426; color: var(--accent); }
.nav-icon { display: inline-block; width: 28px; }
.privacy { position: absolute; bottom: 28px; font-size: 12px; color: var(--muted); line-height: 1.6; }
.content { padding: 36px 38px 70px; min-width: 0; }

/* Tipografia ------------------------------------------------------------ */

.topline, .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 11px; letter-spacing: 1.7px; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font-size: 32px; font-weight: 550; letter-spacing: -1px; margin: 10px 0; }
h2 { font-size: 19px; font-weight: 550; margin: 0; }
h3 { font-size: 15px; margin: 0 0 8px; }
p { color: var(--muted); line-height: 1.6; margin: 8px 0 20px; }
.pill { font-size: 12px; border: 1px solid var(--border); border-radius: 30px; padding: 7px 11px; color: var(--muted); }
.muted { color: var(--muted); }
.caption { font-size: 12px; }
.section { margin: 26px 0; }

/* Progresso ------------------------------------------------------------- */

.hero {
  margin: 28px 0;
  background: linear-gradient(115deg, #2a3828, #1c271f);
  border: 1px solid #40503a;
  border-radius: 20px;
  padding: 25px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
}
.hero strong { font-size: 26px; display: block; margin: 10px 0 4px; }
.hero p { font-size: 13px; margin: 0 0 16px; }
.xp { height: 7px; border-radius: 10px; background: #101710; overflow: hidden; margin: 10px 0; }
.xp div { height: 100%; background: var(--accent); border-radius: 10px; }
.level-badge {
  width: 78px; height: 78px; border-radius: 50%; border: 1px solid #8caa73;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  align-self: center; color: var(--accent); font-size: 12px;
}
.level-badge b { font-size: 30px; }
.areas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0 20px; }
.area { border: 1px solid var(--border); background: var(--panel); border-radius: 14px; padding: 14px 12px; }
.area .symbol { font-size: 22px; color: var(--area); }
.area .name { font-size: 12px; margin-top: 12px; }
.area .meta { font-size: 11px; color: var(--muted); margin-top: 5px; }
.budget { border: 1px solid var(--border); background: var(--panel); border-radius: 14px; padding: 14px 16px; margin: 10px 0 6px; }
.budget .caption { line-height: 1.5; display: block; }

/* Missões --------------------------------------------------------------- */

.tabs { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
.tabs button { border: 0; color: var(--muted); background: var(--panel); }
.tabs button.active { color: var(--accent); background: #2c3928; }
.mission { display: flex; align-items: center; gap: 14px; padding: 17px 0; border-bottom: 1px solid var(--border); }
.check { border-radius: 50%; min-width: 44px; height: 44px; padding: 0; font-size: 18px; background: transparent; }
.check.done { color: var(--accent); background: #2e3a26; }
.mission-info { flex: 1; min-width: 0; }
.mission-info strong { font-size: 14px; font-weight: 550; }
.mission-info small { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; }
.inline-actions { display: flex; gap: 8px; margin-top: 8px; }
.reward { color: var(--accent); font-size: 12px; white-space: nowrap; }
.empty { padding: 30px 18px; text-align: center; border: 1px dashed var(--border); border-radius: 14px; color: var(--muted); line-height: 1.7; }

/* Cartões, tabela e calendário ------------------------------------------ */

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
.card p { font-size: 13px; }
.card .number { font-size: 28px; margin: 10px 0; }
.delta { font-size: 12px; }
.delta.up { color: var(--accent); }
.delta.down { color: var(--warn); }
.delta.same { color: var(--muted); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 550; color: var(--muted); font-size: 12px; padding: 8px 6px; border-bottom: 1px solid var(--border); }
.table td { padding: 10px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table td small { display: block; font-size: 11px; margin-top: 3px; }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 18px 0; }
.day { min-height: 58px; border-radius: 9px; background: #222a23; padding: 8px; color: var(--muted); font-size: 11px; }
.day.has { background: #394d32; color: #dfedce; }
.day.today { outline: 1px solid var(--accent); }
.day b { display: block; margin-top: 7px; font-size: 12px; }
.weekday { font-size: 11px; text-align: center; color: var(--muted); }
.event { padding: 14px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.event small { display: block; color: var(--muted); margin: 6px 0; }
.event p { margin: 6px 0; font-size: 13px; white-space: pre-wrap; }

/* Formulários ----------------------------------------------------------- */

.form { display: grid; gap: 14px; }
label { font-size: 13px; color: var(--muted); display: grid; gap: 7px; }
input, textarea, select {
  width: 100%; border: 1px solid #435040; border-radius: 9px;
  background: #131a15; color: var(--text); padding: 12px;
}
input[type=checkbox] { width: auto; }
textarea { resize: vertical; min-height: 85px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.checkbox-label { display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

/* Estado do aparelho ---------------------------------------------------- */

.status-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--border); }
.status-row strong { font-size: 13px; font-weight: 550; display: block; }
.status-row small { color: var(--muted); font-size: 12px; line-height: 1.5; display: block; margin-top: 3px; }
.dot { font-size: 13px; line-height: 1.5; }
.dot.ok { color: var(--accent); }
.dot.warn { color: var(--warn); }

/* Diálogo, aviso, chat -------------------------------------------------- */

dialog {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 18px; max-width: 470px; width: calc(100% - 30px); max-height: 90vh; padding: 24px;
}
dialog::backdrop { background: #000a; }
dialog p { font-size: 13px; }
#toast {
  position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%);
  background: #d1dfbd; color: #1b2817; border-radius: 12px; padding: 13px 20px;
  max-width: 90%; z-index: 10; display: none; line-height: 1.5; font-size: 14px;
}
.notice {
  border-left: 3px solid var(--accent); background: #222c22; padding: 15px;
  border-radius: 0 10px 10px 0; color: var(--muted); font-size: 13px; line-height: 1.6; margin: 16px 0;
}
.chat { min-height: 220px; max-height: 48vh; overflow-y: auto; margin: 20px 0; display: flex; flex-direction: column; gap: 14px; }
.message { max-width: 90%; padding: 15px; border-radius: 14px; background: var(--panel); white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
.message.user { align-self: flex-end; background: #30402b; }
.chat-form { display: flex; gap: 10px; }
.chat-form textarea { min-height: 55px; }
.integration { display: flex; gap: 15px; margin-bottom: 12px; align-items: center; }
.integration .icon { font-size: 24px; color: var(--accent); width: 30px; }
.integration .info { flex: 1; }
.integration p { margin: 5px 0; font-size: 12px; }
.mobile-brand { display: none; }

/* Celular --------------------------------------------------------------- */

@media (max-width: 800px) {
  .shell { display: block; }
  .sidebar {
    height: auto; position: fixed; bottom: 0; top: auto; width: 100%;
    padding: 8px 5px calc(8px + env(safe-area-inset-bottom));
    border-right: 0; border-top: 1px solid var(--border); background: #151d18; z-index: 5;
  }
  .sidebar .brand, .brand-sub, .privacy { display: none; }
  .nav { flex-direction: row; justify-content: space-around; gap: 0; }
  .nav button { font-size: 10px; padding: 8px 5px; text-align: center; border-radius: 10px; flex: 1; min-height: 52px; }
  .nav-icon { display: block; margin: auto auto 4px; width: auto; font-size: 19px; }
  .content { padding: 24px 19px 120px; }
  .mobile-brand { display: block; font-size: 16px; font-weight: 650; margin-bottom: 26px; color: var(--accent); }
  h1 { font-size: 28px; }
  .areas { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .area { padding: 12px; }
  .hero { padding: 20px; }
  .cards { grid-template-columns: 1fr; }
  .topline { align-items: flex-start; }
  .calendar { gap: 5px; }
  .day { min-height: 50px; padding: 6px 4px; }
  .pill { font-size: 10px; }
  .row h2 { font-size: 17px; }
  .reward { font-size: 11px; }
  .table { font-size: 12px; }
  .table th, .table td { padding: 8px 4px; }
  .form-row { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <script>
/* domain.js */
// Regras do Trajetória. Nenhuma dependência externa: este arquivo roda igual
// no navegador, no WebView do Android e no node --test.

const SCHEMA_VERSION = 2;

const AREAS = [
  { id: 'wellbeing',    name: 'Bem-estar',    icon: '☀', color: '#e9b57a' },
  { id: 'intelligence', name: 'Inteligência', icon: '◎', color: '#a69bea' },
  { id: 'company',      name: 'Empresa',      icon: '▥', color: '#7fb8df' },
  { id: 'strength',     name: 'Força',        icon: '◇', color: '#dc9baa' },
  { id: 'endurance',    name: 'Resistência',  icon: '↗', color: '#8bc5aa' }
];

const PERIODS = { daily: 'Diárias', weekly: 'Semanais', monthly: 'Mensais' };

const KINDS = ['regular', 'wake', 'medication'];

// Limites de XP. O teto por registro impede missões infladas; os tetos diários
// evitam que uma jornada longa vire pontuação maior. Passar do teto não bloqueia
// o registro: a ação continua no histórico, apenas sem XP adicional.
const XP_LIMITS = { perRecord: 30, areaPerDay: 60, totalPerDay: 150 };

const WEEKDAYS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

const XP_PER_LEVEL = 100;
const NOTE_LIMIT = 2000;

function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
  return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
}

function dayKey(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

// Semana de segunda a domingo; mês pelo calendário local.
function periodKey(period, date = new Date()) {
  if (period === 'daily') return dayKey(date);
  if (period === 'monthly') return dayKey(date).slice(0, 7);
  const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  return dayKey(monday);
}

function initialState() {
  return {
    version: SCHEMA_VERSION,
    missions: [
      { id: 'wake',   title: 'Registrar quando acordei', area: 'wellbeing',    period: 'daily', target: 1, xp: 5,  kind: 'wake' },
      { id: 'med-am', title: 'Remédio da manhã',         area: 'wellbeing',    period: 'daily', target: 1, xp: 0,  kind: 'medication' },
      { id: 'med-pm', title: 'Remédio da noite',         area: 'wellbeing',    period: 'daily', target: 1, xp: 0,  kind: 'medication' },
      { id: 'read',   title: 'Ler por 5 minutos',        area: 'intelligence', period: 'daily', target: 1, xp: 10, kind: 'regular' },
      { id: 'study',  title: 'Estudar por 5 minutos',    area: 'intelligence', period: 'daily', target: 1, xp: 10, kind: 'regular' }
    ],
    events: [],
    chat: [],
    settings: defaultSettings(),
    drafts: defaultDrafts()
  };
}

function defaultSettings() {
  return {
    name: 'Você',
    nightReminder: false,
    nightReminderTime: '20:00',
    morningReminder: true,
    lockOnResume: true,
    aiEndpoint: '',
    aiContext: false,
    limits: { ...XP_LIMITS }
  };
}

function defaultDrafts() {
  return [
    { title: 'Natação pela manhã', detail: 'Sexta, sábado e domingo. Ative quando as aulas realmente começarem.', area: 'endurance', period: 'weekly', target: 3, xp: 15, days: [5, 6, 0] },
    { title: 'Planejar as duas frentes da empresa', detail: 'Escolher uma entrega de sites e uma do SaaS.', area: 'company', period: 'weekly', target: 1, xp: 15 },
    { title: 'Calistenia em casa', detail: 'Definir primeiro uma sessão inicial possível.', area: 'strength', period: 'weekly', target: 1, xp: 10 },
    { title: 'Corrida', detail: 'Escolher frequência e uma sessão inicial possível.', area: 'endurance', period: 'weekly', target: 1, xp: 10 }
  ];
}

function area(id) {
  return AREAS.find(a => a.id === id);
}

function activeMissions(state, period) {
  return state.missions.filter(m => !m.archivedAt && (!period || m.period === period));
}

function progress(state, mission, date = new Date()) {
  const key = periodKey(mission.period, date);
  return state.events.filter(e => e.missionId === mission.id && e.periodKey === key).length;
}

function eventsOfDay(state, date = new Date()) {
  const key = dayKey(date);
  return state.events.filter(e => dayKey(new Date(e.at)) === key);
}

function limits(state) {
  const configured = (state.settings && state.settings.limits) || {};
  return { ...XP_LIMITS, ...configured };
}

// Quanto XP a próxima ação desta área ainda rende hoje.
function remainingXP(state, areaId, date = new Date()) {
  const lim = limits(state);
  const day = eventsOfDay(state, date);
  const used = day.reduce((sum, e) => sum + e.xp, 0);
  const usedInArea = day.filter(e => e.area === areaId).reduce((sum, e) => sum + e.xp, 0);
  return Math.max(0, Math.min(lim.areaPerDay - usedInArea, lim.totalPerDay - used));
}

function complete(state, id, note = '', date = new Date()) {
  const mission = state.missions.find(m => m.id === id);
  if (!mission) throw Error('Missão não encontrada.');
  if (mission.archivedAt) throw Error('Esta missão está arquivada.');
  if (progress(state, mission, date) >= mission.target) throw Error('Meta deste período já concluída.');
  const planned = mission.xp;
  const granted = Math.min(planned, remainingXP(state, mission.area, date));
  const event = {
    id: uuid(),
    type: 'mission',
    missionId: mission.id,
    title: mission.title,
    area: mission.area,
    period: mission.period,
    periodKey: periodKey(mission.period, date),
    at: date.toISOString(),
    xp: granted,
    note: String(note).slice(0, NOTE_LIMIT),
    kind: mission.kind || 'regular'
  };
  if (granted !== planned) event.xpPlanned = planned;
  return { ...state, events: [...state.events, event] };
}

// Sono entra como registro próprio: a data do evento é a hora de acordar.
function logSleep(state, { bed, wake, note = '' }) {
  const bedAt = new Date(bed);
  const wakeAt = new Date(wake);
  const hours = (wakeAt - bedAt) / 3600000;
  if (!Number.isFinite(hours) || hours <= 0 || hours > 24) {
    throw Error('Confira os horários: o intervalo deve ser maior que zero e de até 24 horas.');
  }
  const event = {
    id: uuid(),
    type: 'sleep',
    missionId: 'sleep-log',
    title: 'Sono registrado',
    area: 'wellbeing',
    period: 'daily',
    periodKey: periodKey('daily', wakeAt),
    at: wakeAt.toISOString(),
    xp: 0,
    note: String(note).slice(0, NOTE_LIMIT),
    kind: 'sleep',
    sleep: { bed: bedAt.toISOString(), wake: wakeAt.toISOString(), hours: Number(hours.toFixed(2)) }
  };
  return { ...state, events: [...state.events, event] };
}

function removeEvent(state, id) {
  if (!state.events.some(e => e.id === id)) throw Error('Registro não encontrado.');
  return { ...state, events: state.events.filter(e => e.id !== id) };
}

function totalXP(state, areaId) {
  return state.events.filter(e => !areaId || e.area === areaId).reduce((sum, e) => sum + e.xp, 0);
}

function level(xp) {
  return { number: Math.floor(xp / XP_PER_LEVEL) + 1, current: xp % XP_PER_LEVEL, next: XP_PER_LEVEL };
}

function checkMissionInput(input) {
  const title = String(input.title || '').trim();
  if (!title || title.length > 140) throw Error('Escreva um título de até 140 caracteres.');
  if (!AREAS.some(a => a.id === input.area) || !PERIODS[input.period]) throw Error('Área ou período inválido.');
  const target = Number(input.target);
  if (!Number.isInteger(target) || target < 1 || target > 31) throw Error('A meta deve ser de 1 a 31 registros por período.');
  const xp = Number(input.xp ?? 10);
  if (!Number.isInteger(xp) || xp < 0 || xp > XP_LIMITS.perRecord) throw Error(`Use de 0 a ${XP_LIMITS.perRecord} XP por registro.`);
  const days = Array.isArray(input.days)
    ? input.days.map(Number).filter(d => Number.isInteger(d) && d >= 0 && d <= 6)
    : null;
  const fields = { title, area: input.area, period: input.period, target, xp, sidequest: !!input.sidequest };
  if (days && days.length) fields.days = [...new Set(days)].sort();
  return fields;
}

function addMission(state, input) {
  const fields = checkMissionInput(input);
  const kind = KINDS.includes(input.kind) ? input.kind : 'regular';
  const mission = { id: uuid(), ...fields, kind, xp: kind === 'medication' ? 0 : fields.xp };
  return { ...state, missions: [...state.missions, mission] };
}

function editMission(state, id, input) {
  const current = state.missions.find(m => m.id === id);
  if (!current) throw Error('Missão não encontrada.');
  const fields = checkMissionInput(input);
  const next = { ...current, ...fields, xp: current.kind === 'medication' ? 0 : fields.xp };
  if (!fields.days) delete next.days;
  return { ...state, missions: state.missions.map(m => (m.id === id ? next : m)) };
}

// Arquivar preserva todo o histórico já registrado; a missão sai das listas.
function archiveMission(state, id, date = new Date()) {
  if (!state.missions.some(m => m.id === id)) throw Error('Missão não encontrada.');
  return {
    ...state,
    missions: state.missions.map(m => (m.id === id ? { ...m, archivedAt: date.toISOString() } : m))
  };
}

function restoreMission(state, id) {
  return {
    ...state,
    missions: state.missions.map(m => {
      if (m.id !== id) return m;
      const copy = { ...m };
      delete copy.archivedAt;
      return copy;
    })
  };
}

function windowBounds(days, date) {
  const end = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  end.setDate(end.getDate() + 1);
  const start = new Date(end);
  start.setDate(start.getDate() - days);
  const before = new Date(start);
  before.setDate(before.getDate() - days);
  return { before, start, end };
}

function summarize(state, from, to) {
  const inside = state.events.filter(e => {
    const at = new Date(e.at);
    return at >= from && at < to;
  });
  const byArea = {};
  for (const a of AREAS) byArea[a.id] = { records: 0, xp: 0 };
  for (const e of inside) {
    if (!byArea[e.area]) byArea[e.area] = { records: 0, xp: 0 };
    byArea[e.area].records += 1;
    byArea[e.area].xp += e.xp;
  }
  const activeDays = new Set(inside.map(e => dayKey(new Date(e.at)))).size;
  return { records: inside.length, xp: inside.reduce((s, e) => s + e.xp, 0), activeDays, byArea };
}

// Comparação com você mesmo: a janela atual contra a janela anterior do mesmo tamanho.
function compare(state, days = 7, date = new Date()) {
  const { before, start, end } = windowBounds(days, date);
  return { days, current: summarize(state, start, end), previous: summarize(state, before, start) };
}

function sleepRecords(state, days = 14, date = new Date()) {
  const { start, end } = windowBounds(days, date);
  return state.events
    .filter(e => e.type === 'sleep' && e.sleep)
    .filter(e => {
      const at = new Date(e.at);
      return at >= start && at < end;
    })
    .sort((a, b) => new Date(a.at) - new Date(b.at));
}

// ---------------------------------------------------------------------------
// Migração e validação. Nada é apagado numa atualização de esquema.
// ---------------------------------------------------------------------------

function migrate(value) {
  if (!value || typeof value !== 'object') throw Error('Backup vazio ou ilegível.');
  if (typeof value.version !== 'number' || value.version < 1) throw Error('Backup sem versão reconhecida.');
  if (value.version > SCHEMA_VERSION) {
    throw Error('Este backup vem de uma versão mais nova do aplicativo. Atualize o aplicativo antes de restaurar.');
  }
  let next = value;
  if (next.version === 1) {
    next = {
      ...next,
      version: 2,
      settings: { ...defaultSettings(), ...(next.settings || {}), limits: { ...XP_LIMITS, ...((next.settings || {}).limits || {}) } },
      events: (next.events || []).map(e => (e.kind === 'sleep' ? { ...e, type: 'sleep' } : e)),
      drafts: Array.isArray(next.drafts) ? next.drafts : defaultDrafts()
    };
  }
  return next;
}

function validArea(id) {
  return AREAS.some(a => a.id === id);
}

function validateBackup(value) {
  const state = migrate(value);
  if (!Array.isArray(state.missions) || !Array.isArray(state.events) || !Array.isArray(state.chat) || !Array.isArray(state.drafts) || !state.settings) {
    throw Error('Backup incompatível.');
  }
  const seenMissions = new Set();
  for (const m of state.missions) {
    if (typeof m.id !== 'string' || !m.id || seenMissions.has(m.id)) throw Error('Missões inválidas.');
    seenMissions.add(m.id);
    checkMissionInput(m);
    if (m.kind !== undefined && !KINDS.includes(m.kind)) throw Error('Tipo de missão inválido.');
    if (m.kind === 'medication' && m.xp !== 0) throw Error('Medicação não recebe XP.');
    if (m.archivedAt !== undefined && !Number.isFinite(Date.parse(m.archivedAt))) throw Error('Data de arquivamento inválida.');
  }
  const seenEvents = new Set();
  for (const e of state.events) {
    const okType = e.type === 'mission' || e.type === 'sleep';
    const okXP = Number.isInteger(e.xp) && e.xp >= 0 && e.xp <= XP_LIMITS.perRecord;
    const okPlanned = e.xpPlanned === undefined || (Number.isInteger(e.xpPlanned) && e.xpPlanned >= 0 && e.xpPlanned <= XP_LIMITS.perRecord);
    if (typeof e.id !== 'string' || !e.id || seenEvents.has(e.id) || !okType ||
        typeof e.missionId !== 'string' || typeof e.title !== 'string' ||
        !validArea(e.area) || !PERIODS[e.period] ||
        typeof e.periodKey !== 'string' || !/^\d{4}-\d{2}(-\d{2})?$/.test(e.periodKey) ||
        !Number.isFinite(Date.parse(e.at)) || !okXP || !okPlanned || typeof e.note !== 'string') {
      throw Error('Histórico inválido.');
    }
    if (e.type === 'sleep') {
      const s = e.sleep;
      if (!s || !Number.isFinite(Date.parse(s.bed)) || !Number.isFinite(Date.parse(s.wake))) throw Error('Registro de sono inválido.');
    }
    seenEvents.add(e.id);
  }
  if (state.chat.some(m => !['user', 'assistant'].includes(m.role) || typeof m.content !== 'string')) {
    throw Error('Conversa inválida.');
  }
  const s = state.settings;
  if (typeof s.name !== 'string' || typeof s.aiEndpoint !== 'string' ||
      typeof s.aiContext !== 'boolean' || typeof s.nightReminder !== 'boolean' ||
      typeof s.morningReminder !== 'boolean' || typeof s.lockOnResume !== 'boolean' ||
      !/^([01]\d|2[0-3]):[0-5]\d$/.test(s.nightReminderTime || '')) {
    throw Error('Configurações inválidas.');
  }
  const lim = s.limits || {};
  for (const field of ['areaPerDay', 'totalPerDay']) {
    if (!Number.isInteger(lim[field]) || lim[field] < 0 || lim[field] > 1000) throw Error('Limites de XP inválidos.');
  }
  if (s.aiEndpoint) {
    let url;
    try {
      url = new URL(s.aiEndpoint);
    } catch {
      throw Error('Endereço do serviço de IA inválido.');
    }
    if (url.protocol !== 'https:' || url.username || url.password) throw Error('Endereço do serviço de IA inválido.');
  }
  for (const draft of state.drafts) checkMissionInput(draft);
  return state;
}

/* storage.js */
// Persistência. No Android os dados passam pela ponte Java (gravação cifrada
// com o Android Keystore). No navegador vão para o localStorage, sem cifra —
// a prévia serve para testar a interface, não para guardar dados sensíveis.

const KEY = 'trajetoria.v1';

function bridge() {
  return typeof window !== 'undefined' ? window.Android : undefined;
}

function storageKind() {
  return bridge() ? 'android' : 'browser';
}

function readRaw() {
  const native = bridge();
  if (native) return native.readState();
  return localStorage.getItem(KEY);
}

function read() {
  const raw = readRaw();
  if (!raw) return initialState();
  return validateBackup(JSON.parse(raw));
}

function write(state) {
  const raw = JSON.stringify(state);
  const native = bridge();
  if (native) {
    if (!native.writeState(raw)) throw Error('Não foi possível salvar neste aparelho.');
    return;
  }
  localStorage.setItem(KEY, raw);
}

function backupFileName(encrypted) {
  return `trajetoria-${new Date().toISOString().slice(0, 10)}${encrypted ? '.tjb' : '.json'}`;
}

// ---------------------------------------------------------------------------
// Backup opcionalmente cifrado com uma senha que só você conhece.
// Formato: JSON com cabeçalho legível + conteúdo AES-GCM derivado por PBKDF2.
// ---------------------------------------------------------------------------

const PBKDF2_ROUNDS = 310000;

function b64(bytes) {
  let out = '';
  for (const byte of bytes) out += String.fromCharCode(byte);
  return btoa(out);
}

function unb64(text) {
  return Uint8Array.from(atob(text), c => c.charCodeAt(0));
}

async function derive(passphrase, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: PBKDF2_ROUNDS, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptBackup(plain, passphrase) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await derive(passphrase, salt);
  const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plain));
  return JSON.stringify({
    format: 'trajetoria-backup',
    schema: SCHEMA_VERSION,
    kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: PBKDF2_ROUNDS },
    cipher: 'AES-GCM',
    salt: b64(salt),
    iv: b64(iv),
    data: b64(new Uint8Array(data))
  }, null, 2);
}

function isEncryptedBackup(text) {
  try {
    const value = JSON.parse(text);
    return value && value.format === 'trajetoria-backup' && typeof value.data === 'string';
  } catch {
    return false;
  }
}

async function decryptBackup(text, passphrase) {
  const envelope = JSON.parse(text);
  if (envelope.cipher !== 'AES-GCM' || !envelope.kdf || envelope.kdf.name !== 'PBKDF2') {
    throw Error('Formato de backup cifrado não reconhecido.');
  }
  const salt = unb64(envelope.salt);
  const iv = unb64(envelope.iv);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: envelope.kdf.iterations, hash: envelope.kdf.hash },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  let plain;
  try {
    plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, unb64(envelope.data));
  } catch {
    throw Error('Senha incorreta ou arquivo alterado.');
  }
  return new TextDecoder().decode(plain);
}

// Entrega o arquivo: no Android pelo seletor de documentos, no navegador por download.
function saveBackupFile(text, encrypted) {
  const native = bridge();
  if (native) {
    native.exportBackup(text, backupFileName(encrypted));
    return;
  }
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = backupFileName(encrypted);
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Interface do Trajetória. Sem bibliotecas: tudo é string de HTML escapada e

const fmtDate = d => new Date(d).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
const fmtDateTime = d => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const native = () => window.Android;

let state = null;
let loadError = '';
let page = 'today';
let period = 'daily';
let compareDays = 7;
let busy = false;
let nativeStatus = null;

const modal = document.querySelector('#modal');

try {
  state = read();
} catch (err) {
  loadError = err.message || 'Não foi possível abrir os dados.';
}

function toast(message) {
  const el = document.querySelector('#toast');
  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = 'none'; }, 4600);
}

function commit(next) {
  write(next);
  state = next;
  render();
}

function refreshNativeStatus() {
  const api = native();
  if (!api || !api.status) return;
  try {
    nativeStatus = JSON.parse(api.status());
  } catch {
    nativeStatus = null;
  }
}

function tabs() {
  return `<div class="tabs" role="tablist">${Object.entries(PERIODS).map(([id, name]) =>

}

function dayHint(mission) {
  if (!mission.days || !mission.days.length) return '';
  return ` · ${mission.days.map(d => WEEKDAYS[d].slice(0, 3)).join(', ')}`;
}

function missionRow(mission) {
  const done = progress(state, mission);
  const full = done >= mission.target;
  const a = area(mission.area);
  const left = remainingXP(state, mission.area);
  const reward = mission.xp === 0
    ? 'Cuidado pessoal'
    : (left === 0 ? `+0 XP hoje · teto` : `+${Math.min(mission.xp, left)} XP`);
  const canEdit = (mission.kind || 'regular') === 'regular';
  return `<div class="mission">
    <button class="check ${full ? 'done' : ''}" data-complete="${esc(mission.id)}" ${full ? 'disabled' : ''}
      aria-label="Registrar ${esc(mission.title)}">${full ? '✓' : '+'}</button>
    <div class="mission-info">
      <strong>${esc(mission.title)}</strong>
      <small style="color:${a.color}">${a.name} · ${done}/${mission.target}${mission.sidequest ? ' · Side quest' : ''}${dayHint(mission)}</small>
      <span class="inline-actions">
        ${canEdit ? `<button class="small ghost" data-edit="${esc(mission.id)}">Ajustar</button>` : ''}
        ${canEdit ? `<button class="small ghost" data-archive="${esc(mission.id)}">Arquivar</button>` : ''}
      </span>
    </div>
    <span class="reward">${reward}</span>
  </div>`;
}

function missionList(onlySidequests) {
  const list = activeMissions(state, period).filter(m => !!m.sidequest === !!onlySidequests);
  if (!list.length) {
    return `<div class="empty">${onlySidequests
      ? 'Nenhuma side quest neste período.'
      : `Você ainda não definiu missões ${PERIODS[period].toLowerCase()}.<br>Escolha uma meta que caiba na sua rotina.`}</div>`;
  }
  return list.map(missionRow).join('');
}

function areaCards() {
  return `<div class="areas">${AREAS.map(a => {
    const xp = totalXP(state, a.id);
    return `<div class="area" style="--area:${a.color}">
      <span class="symbol">${a.icon}</span>
      <div class="name">${a.name}</div>
      <div class="meta">Nível ${level(xp).number} · ${xp} XP</div>
    </div>`;
  }).join('')}</div>`;
}

function dailyBudget() {
  const lim = { ...XP_LIMITS, ...(state.settings.limits || {}) };
  const used = eventsOfDay(state).reduce((sum, e) => sum + e.xp, 0);
  const pct = lim.totalPerDay ? Math.min(100, Math.round((used / lim.totalPerDay) * 100)) : 0;
  return `<div class="budget">
    <div class="row"><span class="caption">XP de hoje</span><span class="caption muted">${used} / ${lim.totalPerDay}</span></div>
    <div class="xp"><div style="width:${pct}%"></div></div>
    <span class="caption muted">Teto diário por área: ${lim.areaPerDay} XP. Depois do teto a ação continua registrada, só não soma XP — trabalhar mais horas não rende mais pontos.</span>
  </div>`;
}

function deltaLabel(current, previous) {
  const diff = current - previous;
  if (diff === 0) return '<span class="delta same">igual ao período anterior</span>';
  const sign = diff > 0 ? '+' : '−';
  return `<span class="delta ${diff > 0 ? 'up' : 'down'}">${sign}${Math.abs(diff)} em relação ao período anterior</span>`;
}

function calendar() {
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const cells = [];
  for (let i = 0; i < (first.getDay() + 6) % 7; i++) cells.push('<div></div>');
  const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  for (let n = 1; n <= lastDay; n++) {
    const key = dayKey(new Date(now.getFullYear(), now.getMonth(), n));
    const count = state.events.filter(e => dayKey(new Date(e.at)) === key).length;
    cells.push(`<div class="day ${count ? 'has' : ''} ${key === dayKey() ? 'today' : ''}">${n}${count ? `<b>${count}</b>` : ''}</div>`);
  }
  return `<div class="card">
    <h2>${esc(now.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }))}</h2>
    <div class="calendar">${['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map(x => `<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div>
    <span class="caption muted">Cada número é a quantidade de registros do dia. Um dia vazio não apaga o que já passou.</span>
  </div>`;
}

const TOKEN_KEY = 'trajetoria.ai.token';

function hasToken() {
  try {
    return !!localStorage.getItem(TOKEN_KEY);
  } catch {
    return false;
  }
}

function readToken() {
  try {
    return localStorage.getItem(TOKEN_KEY) || '';
  } catch {
    return '';
  }
}

function writeToken(value) {
  try {
    if (value) localStorage.setItem(TOKEN_KEY, value);
    else localStorage.removeItem(TOKEN_KEY);
  } catch {
    toast('Não foi possível guardar o token neste aparelho.');
  }
}

async function importText(raw) {
  let text = raw;
  if (isEncryptedBackup(text)) {
    const pass = await askPassphrase();
    if (pass === null) return;
    try {
      text = await decryptBackup(raw, pass);
    } catch (err) {
      toast(err.message);
      return;
    }
  }
  let next;
  try {
    next = validateBackup(JSON.parse(text));
  } catch (err) {
    toast(`Backup não restaurado: ${err.message}`);
    return;
  }
  confirmDialog(
    'Restaurar este backup?',
    `Ele substitui os dados deste aparelho por ${next.events.length} registros e ${next.missions.length} missões. Exporte o histórico atual primeiro, se quiser preservá-lo.`,
    () => {
      commit(next);
      const api = native();
      if (api) {
        api.disableReminders();
        if (next.settings.nightReminder) toast('Backup restaurado. Reative o lembrete em Conexões.');
      }
      toast('Backup restaurado.');
    },
    'Restaurar'
  );
}

  return new Promise(resolve => {

function pickBackupFile() {
  const api = native();
  if (api) { api.importBackup(); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,.tjb,application/json';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 10000000) { toast('Backup muito grande.'); return; }
    await importText(await file.text());
  };
  input.click();
}

async function sendChat(e) {
  e.preventDefault();
  if (busy) return;
  const message = String(new FormData(e.target).get('message') || '').trim();
  if (!message) return;
  try {
    commit({ ...state, chat: [...state.chat, { role: 'user', content: message }] });
  } catch (err) {
    toast(err.message);
    return;
  }
  if (!state.settings.aiEndpoint) {
    toast('Pergunta guardada. Configure o serviço em Conexões para receber respostas reais.');
    return;
  }
  busy = true;
  render();
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 45000);
  try {
    const context = state.settings.aiContext
      ? activeMissions(state).filter(m => ['company', 'intelligence'].includes(m.area)).map(m => ({ title: m.title, period: m.period, area: m.area }))
      : undefined;
    const headers = { 'Content-Type': 'application/json' };
    const token = readToken();
    if (token) headers.Authorization = `Bearer ${token}`;
    const response = await fetch(state.settings.aiEndpoint, {
      method: 'POST',
      headers,
      body: JSON.stringify({ messages: state.chat.slice(-20), ...(context ? { context } : {}) }),
      signal: controller.signal,
      credentials: 'omit',
      redirect: 'error'
    });
    if (response.status === 401 || response.status === 403) throw Error('O serviço recusou o token de acesso.');
    if (response.status === 429) throw Error('Limite de uso do seu serviço atingido.');
    if (!response.ok) throw Error(`O serviço respondeu com erro ${response.status}.`);
    const data = await response.json();
    if (typeof data.reply !== 'string' || !data.reply.trim()) throw Error('O serviço não enviou uma resposta válida.');
    commit({ ...state, chat: [...state.chat, { role: 'assistant', content: data.reply.slice(0, 30000) }] });
  } catch (err) {
    toast(err.name === 'AbortError'
      ? 'A conexão demorou demais. Sua pergunta foi preservada.'
      : `Sem resposta da IA. ${err.message}`);
  } finally {
    clearTimeout(timeout);
    busy = false;
    render();
  }
}

  export: () => exportDialog(),
  import: () => pickBackupFile(),
  reminders: () => {
    const api = native();
    if (!api) { toast('Este lembrete existe apenas no aplicativo Android.'); return; }
    api.enableReminders(state.settings.nightReminderTime);
  },
  'disable-reminders': () => {
    const api = native();
    if (api) api.disableReminders();
    commit({ ...state, settings: { ...state.settings, nightReminder: false } });
    toast('Lembrete desativado.');
  },
  'clear-chat': () => confirmDialog('Apagar conversa?', 'As mensagens serão removidas deste aparelho. Seus registros e XP não mudam.', () => commit({ ...state, chat: [] }), 'Apagar'),
  'refresh-status': () => { refreshNativeStatus(); render(); },
  battery: () => { const api = native(); if (api && api.openBatterySettings) api.openBatterySettings(); },
  'app-settings': () => { const api = native(); if (api && api.openAppSettings) api.openAppSettings(); }
};

function bind() {
  document.querySelectorAll('[data-page]').forEach(b => { b.onclick = () => { page = b.dataset.page; render(); window.scrollTo(0, 0); }; });
  document.querySelectorAll('[data-period]').forEach(b => { b.onclick = () => { period = b.dataset.period; render(); }; });
  document.querySelectorAll('[data-compare]').forEach(b => { b.onclick = () => { compareDays = Number(b.dataset.compare); render(); }; });
  document.querySelectorAll('[data-complete]').forEach(b => { b.onclick = () => completeDialog(b.dataset.complete); });
  document.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => missionDialog(state.missions.find(m => m.id === b.dataset.edit), true); });
  document.querySelectorAll('[data-draft]').forEach(b => { b.onclick = () => missionDialog(state.drafts[Number(b.dataset.draft)], false); });
  document.querySelectorAll('[data-restore]').forEach(b => { b.onclick = () => commit(restoreMission(state, b.dataset.restore)); });
  document.querySelectorAll('[data-archive]').forEach(b => {
    b.onclick = () => confirmDialog('Arquivar esta missão?', 'Ela sai das listas e o histórico já registrado continua no seu progresso. Você pode reativá-la depois.', () => commit(archiveMission(state, b.dataset.archive)), 'Arquivar');
  });
  document.querySelectorAll('[data-undo]').forEach(b => {
    b.onclick = () => confirmDialog('Corrigir registro?', 'O registro sai do histórico e o XP é recalculado.', () => commit(removeEvent(state, b.dataset.undo)), 'Corrigir');
  });
  document.querySelectorAll('[data-action]').forEach(b => {
    b.onclick = () => {
      try {
        const run = ACTIONS[b.dataset.action];
        if (run) run();
      } catch (err) {
        toast(err.message);
      }
    };
  });

  const profile = document.querySelector('#profile');
  if (profile) profile.onsubmit = e => {
    e.preventDefault();
    const name = String(new FormData(e.target).get('name') || '').trim() || 'Você';
    commit({ ...state, settings: { ...state.settings, name } });
    toast('Nome salvo.');
  };

  const reminders = document.querySelector('#reminder-settings');
  if (reminders) reminders.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const time = String(f.get('nightTime') || '');
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) { toast('Horário inválido.'); return; }
    const next = { ...state, settings: { ...state.settings, nightReminderTime: time, morningReminder: f.has('morning') } };
    commit(next);
    const api = native();
    if (api && next.settings.nightReminder) api.enableReminders(time);
    toast('Horários salvos conforme a sua prescrição.');
  };

  const limits = document.querySelector('#limits');
  if (limits) limits.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const areaPerDay = Number(f.get('areaPerDay'));
    const totalPerDay = Number(f.get('totalPerDay'));
    if (!Number.isInteger(areaPerDay) || !Number.isInteger(totalPerDay) || areaPerDay < 0 || totalPerDay < 0) { toast('Use números inteiros.'); return; }
    commit({ ...state, settings: { ...state.settings, limits: { ...XP_LIMITS, areaPerDay, totalPerDay } } });
    toast('Limites salvos.');
  };

  const security = document.querySelector('#security');
  if (security) security.onsubmit = e => {
    e.preventDefault();
    const lockOnResume = new FormData(e.target).has('lockOnResume');
    commit({ ...state, settings: { ...state.settings, lockOnResume } });
    const api = native();
    if (api && api.setLockOnResume) api.setLockOnResume(lockOnResume);
    toast('Preferência de segurança salva.');
  };

  const ai = document.querySelector('#ai-settings');
  if (ai) ai.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const endpoint = String(f.get('endpoint') || '').trim();
    if (endpoint) {
      try {
        const url = new URL(endpoint);
        if (url.protocol !== 'https:' || url.username || url.password) throw Error();
      } catch {
        toast('Use um endereço HTTPS, sem usuário ou senha na URL.');
        return;
      }
    }
    const token = String(f.get('token') || '');
    if (token) writeToken(token.trim());
    if (!endpoint) writeToken('');
    commit({ ...state, settings: { ...state.settings, aiEndpoint: endpoint, aiContext: f.has('context') } });
    toast('Configuração salva. Nenhuma chave de provedor fica neste aplicativo.');
  };

  const form = document.querySelector('#chat-form');
  if (form) form.addEventListener('submit', sendChat);
}

refreshNativeStatus();
render();

</script>
</body>
</html>
